<div class="main-container pt-5">
  <h3 class="text-center">Our Services</h3>
  <h2 class="text-center pt-3">What We Offer</h2>

  <div class="container py-4">
    <div class="text-center" *ngIf="isLoading">
      <p>Loading services...</p>
    </div>

    <div class="alert alert-warning text-center" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="row" *ngIf="!isLoading && !errorMessage">
      <div class="col-12 col-sm-6 col-lg-4 mb-4" *ngFor="let data of cards">
        <div class="box">
          <div class="image-wrapper">
            <div class="glitch-img">
              <img [src]="data.image_url" [alt]="data.title" class="original-img" />
              <img [src]="data.glitch_image_url || data.image_url" [alt]="data.title + ' glitch'" class="glitch-img-hover" />
            </div>
            <div class="overlay">
              <h4 class="card-title">{{ data.title }}</h4>
            </div>
          </div>
          <div class="card-description">
            <p>{{ data.description }}</p>
          </div>
        </div>
      </div>

      <div class="col-12 text-center" *ngIf="cards.length === 0">
        <p>No services available right now. Please check back soon.</p>
      </div>
    </div>
  </div>
</div>
