<div class="main-container">
  <div class="container py-5">
    <h2 class="text-center mb-4" data-aos="fade-up">Why Choose AESPARROW?</h2>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Loading content...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="alert alert-danger" role="alert">
      {{ error }}
    </div>

    <!-- Content -->
    <div *ngIf="!isLoading" class="row g-4 mt-4">
      <div class="col-md-6" *ngFor="let item of whyChooseItems">
        <div class="feature-card d-flex align-items-start p-4 border rounded-3 h-100" data-aos="fade-up">
          <div class="me-3">
            <div class="icon-box bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
              <i [class]="item.icon_class || 'bi bi-check-lg'" class="fs-4"></i>
            </div>
          </div>
          <div>
            <h5 class="mb-1">{{ item.title }}</h5>
            <p class="mb-0 text-muted">{{ item.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
